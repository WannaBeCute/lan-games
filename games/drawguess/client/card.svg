<svg xmlns="http://www.w3.org/2000/svg" width="600" height="148" viewBox="0 0 600 148">
  <!-- 亮色纸面，与游戏页主色一致 -->
  <rect width="600" height="148" fill="#fffdf8"/>
  <rect x="14" y="14" width="286" height="120" rx="12" fill="#fff" stroke="#e6ddcd"/>
  <rect x="34" y="34" width="246" height="80" rx="8" fill="#fffdf7" stroke="#d5c8b2"/>
  <!-- 画板里随便涂一笔（不许写字，所以画的是图形） -->
  <path d="M56 92 C80 50, 104 108, 130 66 S182 46, 206 88" fill="none" stroke="#f26b3a" stroke-width="7" stroke-linecap="round"/>
  <circle cx="246" cy="60" r="12" fill="none" stroke="#2f7de1" stroke-width="6"/>
  <path d="M226 92 h40" stroke="#28a06a" stroke-width="6" stroke-linecap="round"/>
  <rect x="34" y="120" width="14" height="6" rx="3" fill="#2b2620"/>
  <rect x="54" y="120" width="14" height="6" rx="3" fill="#e5533d"/>
  <rect x="74" y="120" width="14" height="6" rx="3" fill="#2f7de1"/>
  <!-- 画笔 -->
  <g transform="translate(288 34) rotate(24)">
    <rect x="0" y="0" width="9" height="52" rx="4" fill="#e0a52c"/>
    <path d="M0 52 h9 l-4.5 16 Z" fill="#2b2620"/>
  </g>
  <!-- 三个人的得分气泡 -->
  <g>
    <rect x="330" y="20" width="250" height="34" rx="12" fill="#f2f6ff" stroke="#cfdcf5"/>
    <circle cx="352" cy="37" r="9" fill="#2f7de1"/>
    <rect x="368" y="30" width="150" height="7" rx="3.5" fill="#9db6e8"/>
    <rect x="368" y="41" width="96" height="7" rx="3.5" fill="#c6d5f2"/>
  </g>
  <g>
    <rect x="330" y="60" width="250" height="34" rx="12" fill="#fff2ec" stroke="#f6cdb6"/>
    <circle cx="352" cy="77" r="9" fill="#f26b3a"/>
    <rect x="368" y="70" width="130" height="7" rx="3.5" fill="#f0a882"/>
    <rect x="368" y="81" width="168" height="7" rx="3.5" fill="#f8cdb4"/>
  </g>
  <g>
    <rect x="330" y="100" width="250" height="34" rx="12" fill="#eafaf1" stroke="#b9e6cd"/>
    <circle cx="352" cy="117" r="9" fill="#28a06a"/>
    <rect x="368" y="110" width="112" height="7" rx="3.5" fill="#7fd0a5"/>
    <rect x="368" y="121" width="84" height="7" rx="3.5" fill="#b3e6ca"/>
  </g>
</svg>
